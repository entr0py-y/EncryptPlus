# Crypto Configuration
# This file contains TLS and cryptographic settings

[tls]
# INSECURE: SSLv3 is deprecated
SSLProtocol = -all +SSLv3 +TLSv1

# Weak cipher suite
SSLCipherSuite = DES-CBC3-SHA:RC4-SHA:AES128-SHA

[ssh]
# Weak SSH configuration
Ciphers = aes128-cbc,3des-cbc
MACs = hmac-md5,hmac-sha1
KexAlgorithms = diffie-hellman-group1-sha1
HostKeyAlgorithms = ssh-rsa,ssh-dss

[crypto]
# Weak key size
KeySize = 1024
Algorithm = RSA
Mode = ECB
