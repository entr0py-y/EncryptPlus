services:
  - type: web
    name: encryptplus-api
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: encryptplus-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: HINDSIGHT_ENABLED
        value: "true"
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_BANK_ID
        value: encryptplus-agent

databases:
  - name: encryptplus-db
    databaseName: ecdat
    user: ecdat
    plan: free
    region: oregon
