version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ecdatpassword
      POSTGRES_DB: ecdat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ecdat:ecdatpassword@db:5432/ecdat
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./cryptoscan:/app/cryptoscan

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A apps.api.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://ecdat:ecdatpassword@db:5432/ecdat
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./cryptoscan:/app/cryptoscan

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
